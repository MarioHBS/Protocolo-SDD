[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdd-cli"
version = "4.2.1"
description = "Spec-Driven Development scaffolding for AI coding agents"
authors = [{name = "Mário Henrique", email = "developer.mario.santos@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []          # stdlib only in the default install

[project.optional-dependencies]
dashboard-rich = ["rich>=13.0"]
dashboard-textual = ["textual>=0.80"]
dashboard = ["rich>=13.0", "textual>=0.80"]

[project.scripts]
sdd = "sdd_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sdd_cli"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Pinned so a new ruff release cannot turn CI red by widening its defaults.
select = ["E4", "E7", "E9", "F", "I", "UP"]
